name: Veille APEC

on:
  workflow_dispatch:
    inputs:
      force_teams:
        description: "Forcer l'envoi Teams même si une notification a déjà été envoyée dans les 20 dernières heures"
        required: false
        default: false
        type: boolean

  schedule:
    # Tous les jours à 06h00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write

# Évite que deux exécutions écrivent simultanément sur main
concurrency:
  group: veille-apec-main
  cancel-in-progress: false

jobs:
  veille-apec:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. RÉCUPÉRATION DU DÉPÔT
      # ============================================================
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. INSTALLATION PYTHON
      # ============================================================
      - name: 🐍 Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. INSTALLATION DES DÉPENDANCES
      # ============================================================
      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. VÉRIFICATION DES SECRETS
      # ============================================================
      - name: 🔐 Vérification des secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMS_PRIVATE_WEBHOOK_URL: ${{ secrets.TEAMS_PRIVATE_WEBHOOK_URL }}
          TEAMS_FORCE_SEND: ${{ inputs.force_teams || false }}
        run: |
          echo "========================================"
          echo "VÉRIFICATION DES SECRETS"
          echo "========================================"

          if [ -n "$GEMINI_API_KEY" ]; then
            echo "✅ GEMINI_API_KEY : présente"
          else
            echo "⚠️ GEMINI_API_KEY : absente"
          fi

          if [ -n "$TEAMS_PRIVATE_WEBHOOK_URL" ]; then
            echo "✅ TEAMS_PRIVATE_WEBHOOK_URL : présente"
          else
            echo "⚠️ TEAMS_PRIVATE_WEBHOOK_URL : absente"
          fi

          echo "========================================"

      # ============================================================
      # 5. VÉRIFICATION TEAMS + ARCHIVAGE
      # ============================================================
      - name: 📨 Vérification Teams et mémoire des recherches
        if: always()
        env:
          TEAMS_PRIVATE_WEBHOOK_URL: ${{ secrets.TEAMS_PRIVATE_WEBHOOK_URL }}
          TEAMS_FORCE_SEND: ${{ inputs.force_teams || false }}
        run: |
          echo "========================================"
          echo "VÉRIFICATION TEAMS"
          echo "========================================"
          if [ -f "src/teams.py" ]; then
            echo "✅ src/teams.py présente"
          elif [ -f "teams.py" ]; then
            echo "✅ teams.py présente à la racine"
          else
            echo "❌ teams.py introuvable"
          fi

          if [ -n "$TEAMS_PRIVATE_WEBHOOK_URL" ]; then
            echo "✅ Webhook Teams configuré"
          else
            echo "❌ Webhook Teams absent"
          fi

          echo "Force Teams : ${TEAMS_FORCE_SEND}"
          echo ""
          echo "--- dossiers de recherches ---"
          test -d "data/recherches/rss" && echo "✅ data/recherches/rss" || echo "ℹ️ sera créé par Python"
          test -d "data/recherches/approfondies" && echo "✅ data/recherches/approfondies" || echo "ℹ️ sera créé par Python"
          echo "========================================"

      # ============================================================
      # 5. EXÉCUTION DE LA VEILLE
      # ============================================================
      - name: 🔎 Lancement de la veille APEC
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMS_PRIVATE_WEBHOOK_URL: ${{ secrets.TEAMS_PRIVATE_WEBHOOK_URL }}
          TEAMS_FORCE_SEND: ${{ inputs.force_teams || false }}
          PYTHONUNBUFFERED: "1"

        run: |
          echo "========================================"
          echo "VEILLE APEC"
          echo "========================================"
          echo "Date : $(date '+%d/%m/%Y %H:%M:%S')"
          echo "========================================"

          python src/main.py

      # ============================================================
      # 6. VÉRIFICATION DES FICHIERS PRODUITS
      # ============================================================
      - name: 📊 Vérification des sorties
        if: always()
        run: |
          echo "========================================"
          echo "FICHIERS PRODUITS"
          echo "========================================"

          echo ""
          echo "--- data/ ---"
          ls -lah data/ 2>/dev/null || true

          echo ""
          echo "--- output/ ---"
          ls -lah output/ 2>/dev/null || true

          echo ""
          echo "--- mémoire IA ---"
          if [ -f "data/ia_memoire.json" ]; then
            echo "✅ data/ia_memoire.json présente"
          else
            echo "⚠️ data/ia_memoire.json absente"
          fi

          echo ""
          echo "--- Excel ---"
          if [ -f "data/Apec_Salons_Evenements.xlsx" ]; then
            echo "✅ Apec_Salons_Evenements.xlsx présente"
          else
            echo "⚠️ Fichier Excel absent"
          fi

          echo "========================================"

      # ============================================================
      # 7. COMMIT DES DONNÉES ET DE LA MÉMOIRE
      # ============================================================
      - name: 💾 Sauvegarde des résultats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ output/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement à sauvegarder."
          else
            git commit -m "🔄 Mise à jour automatique veille APEC"

            echo "🔄 Synchronisation avec origin/main..."
            git fetch origin main

            # Le runner peut avoir démarré sur un commit légèrement ancien.
            # On rejoue notre commit au-dessus de la dernière version distante.
            git rebase origin/main

            echo "🚀 Push vers GitHub..."
            git push origin HEAD:main

            echo "✅ Résultats sauvegardés dans GitHub."
          fi

      # ============================================================
      # 8. RÉSUMÉ FINAL
      # ============================================================
      - name: ✅ Résumé
        if: always()
        run: |
          echo "========================================"
          echo "WORKFLOW TERMINÉ"
          echo "========================================"
          echo "Statut GitHub Actions : ${{ job.status }}"
          echo "========================================"
