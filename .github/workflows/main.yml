name: Veille APEC

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  veille-apec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérification des secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMS_PRIVATE_WEBHOOK_URL: ${{ secrets.TEAMS_PRIVATE_WEBHOOK_URL }}
        run: |
          echo "=== VÉRIFICATION DES SECRETS ==="
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY : présente"; else echo "GEMINI_API_KEY : absente"; fi
          if [ -n "$TEAMS_PRIVATE_WEBHOOK_URL" ]; then echo "TEAMS_PRIVATE_WEBHOOK_URL : présente"; else echo "TEAMS_PRIVATE_WEBHOOK_URL : absente"; fi

      - name: Lancement de la veille APEC
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMS_PRIVATE_WEBHOOK_URL: ${{ secrets.TEAMS_PRIVATE_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== VEILLE APEC ==="
          echo "Date : $(date '+%d/%m/%Y %H:%M:%S')"
          python src/main.py

      - name: Détection du rapport PDF final
        id: rapport
        if: always()
        shell: bash
        run: |
          echo "=== RECHERCHE DU RAPPORT PDF ==="
          PDF="$(find output -maxdepth 1 -type f -name 'rapport_veille_*.pdf' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -n "$PDF" ] && [ -f "$PDF" ]; then
            echo "PDF FINAL TROUVÉ : $PDF"
            echo "pdf_path=$PDF" >> "$GITHUB_OUTPUT"
            echo "pdf_found=true" >> "$GITHUB_OUTPUT"
            echo "## Rapport PDF final" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Fichier :** \`$PDF\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aucun rapport PDF final trouvé dans output/"
            echo "pdf_found=false" >> "$GITHUB_OUTPUT"
            echo "## Rapport PDF final introuvable" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo ""
          echo "=== CONTENU DE output/ ==="
          find output -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true

      - name: Publication du rapport PDF comme artifact
        if: always() && steps.rapport.outputs.pdf_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-veille-apec-${{ github.run_number }}
          path: ${{ steps.rapport.outputs.pdf_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Vérification des sorties
        if: always()
        run: |
          echo "=== DATA ==="
          ls -lah data/ 2>/dev/null || true
          echo "=== OUTPUT ==="
          ls -lah output/ 2>/dev/null || true
          echo "=== EXCEL ==="
          if [ -f "data/Apec_Salons_Evenements.xlsx" ]; then echo "Excel présent"; else echo "Excel absent"; fi

      - name: Sauvegarde des résultats
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ output/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Aucun changement à sauvegarder."
          else
            git commit -m "Mise à jour automatique veille APEC"
            git fetch origin main
            git merge --no-edit -X ours origin/main
            git push origin HEAD:main
            echo "Résultats sauvegardés dans GitHub."
          fi

      - name: Résumé final
        if: always()
        shell: bash
        run: |
          echo "=== WORKFLOW TERMINÉ ==="
          echo "Statut : ${{ job.status }}"
          if [ "${{ steps.rapport.outputs.pdf_found }}" = "true" ]; then
            echo "PDF FINAL : ${{ steps.rapport.outputs.pdf_path }}"
            echo "ARTIFACT : rapport-veille-apec-${{ github.run_number }}"
          else
            echo "PDF FINAL : introuvable"
          fi

          {
            echo "## Sortie finale"
            if [ "${{ steps.rapport.outputs.pdf_found }}" = "true" ]; then
              echo "PDF généré : \`${{ steps.rapport.outputs.pdf_path }}\`"
              echo ""
              echo "Artifact : \`rapport-veille-apec-${{ github.run_number }}\`"
            else
              echo "PDF final introuvable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
