name: Veille APEC

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

# Un seul workflow de veille écrit sur main à la fois.
concurrency:
  group: veille-apec-main
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL_31: "gemini-3.1-flash-lite"
      GEMINI_MODEL_38: "gemini-3.8-flash"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Afficher la configuration IA
        run: |
          echo "========================================"
          echo "CONFIGURATION GEMINI"
          echo "========================================"
          echo "Modèle base           : $GEMINI_MODEL_31"
          echo "Modèle enrichissement : $GEMINI_MODEL_38"
          echo "3.1                   : illimité"
          echo "3.8                   : selon configuration du programme"

      - name: Lancer le programme
        run: |
          python -u src/main.py

      - name: Enregistrer les résultats et synchroniser main
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========================================"
          echo "PRÉPARATION DE LA SAUVEGARDE"
          echo "========================================"

          git add data/ output/

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Mise à jour automatique veille APEC"

          echo "========================================"
          echo "SYNCHRONISATION AVEC ORIGIN/MAIN"
          echo "========================================"

          # Plusieurs tentatives protègent contre une mise à jour de main
          # entre le fetch et le push.
          MAX_RETRIES=5
          SUCCESS=0

          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo ""
            echo "🔄 Tentative $attempt/$MAX_RETRIES"

            git fetch --prune origin main

            # Si origin/main a avancé depuis la création du commit local,
            # on le réintègre avant de pousser.
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "⚠️ origin/main a avancé. Fusion avec la version distante..."

              # Les fichiers data/ et output/ sont générés par cette veille.
              # En cas de conflit, la version de ce run reste prioritaire.
              git merge --no-edit -X ours origin/main
            else
              echo "✅ HEAD contient déjà origin/main."
            fi

            echo "🚀 Tentative de push..."
            if git push origin HEAD:main; then
              echo "✅ Push réussi."
              SUCCESS=1
              break
            fi

            echo "⚠️ Push refusé : main a probablement avancé pendant l'opération."

            # On laisse le dépôt se resynchroniser avant la tentative suivante.
            git fetch --prune origin main

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "⏳ Nouvelle tentative dans 3 secondes..."
              sleep 3
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Impossible de synchroniser main après $MAX_RETRIES tentatives."
            echo "État Git :"
            git status --short --branch
            exit 1
          fi

      - name: Fin du workflow
        run: |
          echo "========================================"
          echo "VEILLE APEC TERMINÉE"
          echo "========================================"
