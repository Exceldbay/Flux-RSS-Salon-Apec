name: Veille APEC

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: veille-apec
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL_31: "gemini-3.1-flash-lite"
      GEMINI_MODEL_38: "gemini-3.8-flash"
      SEUIL_GEMINI: "24"
      MAX_GEMINI_38_ANALYSES: "5"
      GEMINI_31_COOLDOWN_SECONDS: "15"
      GEMINI_38_COOLDOWN_SECONDS: "60"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Afficher la configuration IA
        run: |
          echo "========================================"
          echo "CONFIGURATION GEMINI"
          echo "========================================"
          echo "Modèle base       : $GEMINI_MODEL_31"
          echo "Modèle enrichissement : $GEMINI_MODEL_38"
          echo "Seuil Python      : $SEUIL_GEMINI"
          echo "3.1                : illimité"
          echo "Cooldown 3.1       : $GEMINI_31_COOLDOWN_SECONDS s"
          echo "3.8                : max $MAX_GEMINI_38_ANALYSES"
          echo "Cooldown 3.8       : $GEMINI_38_COOLDOWN_SECONDS s"

      - name: Lancer le programme
        run: |
          python -u src/main.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer"
            exit 0
          fi
          git commit -m "Mise à jour automatique de la veille"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Fin du workflow
        run: |
          echo "========================================"
          echo "VEILLE APEC TERMINÉE"
          echo "========================================"
